      <stop offset="0%" stop-color="#173229"/>
      <stop offset="45%" stop-color="#0f2620"/>
      <stop offset="100%" stop-color="#081713"/>
    </linearGradient>
    <radialGradient id="sunspot" cx="72%" cy="20%" r="55%">
