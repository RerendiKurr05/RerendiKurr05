<svg width="760" height="210" viewBox="0 0 760 210" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="sbg" cx="30%" cy="20%" r="90%">
      <stop offset="0%" stop-color="#173229"/>
      <stop offset="60%" stop-color="#0f2620"/>
      <stop offset="100%" stop-color="#081713"/>
    </radialGradient>
    <radialGradient id="padS" cx="35%" cy="30%" r="80%">
      <stop offset="0%" stop-color="#4a8763"/>
      <stop offset="100%" stop-color="#1c4432"/>
    </radialGradient>
  </defs>

  <rect x="1" y="1" width="758" height="208" rx="16" fill="url(#sbg)" stroke="#2e5f47" stroke-width="1"/>

  <!-- faint background ripples -->
  <g stroke="#2e5f47" fill="none" opacity="0.4">
    <circle cx="700" cy="30" r="14" stroke-width="1"/>
    <circle cx="700" cy="30" r="24" stroke-width="0.7" opacity="0.6"/>
  </g>
  <g fill="#a9c4b3" opacity="0.3">
    <circle cx="200" cy="24" r="1"/>
    <circle cx="600" cy="170" r="1.2"/>
    <circle cx="80" cy="160" r="1"/>
  </g>

  <!-- three lily-pad stat pods -->
  <g transform="translate(105,72)">
    <ellipse cx="4" cy="6" rx="66" ry="52" fill="#081713" opacity="0.25"/>
    <ellipse cx="0" cy="0" rx="64" ry="50" fill="url(#padS)" stroke="#1c4432" stroke-width="1.5"/>
    <path d="M0 -50 L0 50 M-56 -20 L56 20 M-56 20 L56 -20" stroke="#1c4432" stroke-width="0.7" opacity="0.35"/>
    <text x="0" y="4" text-anchor="middle" font-family="'Segoe UI',Helvetica,Arial,sans-serif" font-size="32" font-weight="800" fill="#f0ead8">4</text>
    <text x="0" y="26" text-anchor="middle" font-family="'Segoe UI',Helvetica,Arial,sans-serif" font-size="10.5" fill="#e8f2ea" letter-spacing="0.5">repos in the pond</text>
  </g>

  <g transform="translate(325,72)">
    <ellipse cx="4" cy="6" rx="66" ry="52" fill="#081713" opacity="0.25"/>
    <ellipse cx="0" cy="0" rx="64" ry="50" fill="url(#padS)" stroke="#1c4432" stroke-width="1.5"/>
    <path d="M0 -50 L0 50 M-56 -20 L56 20 M-56 20 L56 -20" stroke="#1c4432" stroke-width="0.7" opacity="0.35"/>
    <text x="0" y="4" text-anchor="middle" font-family="'Segoe UI',Helvetica,Arial,sans-serif" font-size="32" font-weight="800" fill="#f0ead8">491</text>
    <text x="0" y="26" text-anchor="middle" font-family="'Segoe UI',Helvetica,Arial,sans-serif" font-size="10.5" fill="#e8f2ea" letter-spacing="0.5">stars collected</text>
  </g>

  <g transform="translate(545,72)">
    <ellipse cx="4" cy="6" rx="66" ry="52" fill="#081713" opacity="0.25"/>
    <ellipse cx="0" cy="0" rx="64" ry="50" fill="url(#padS)" stroke="#1c4432" stroke-width="1.5"/>
    <path d="M0 -50 L0 50 M-56 -20 L56 20 M-56 20 L56 -20" stroke="#1c4432" stroke-width="0.7" opacity="0.35"/>
    <text x="0" y="4" text-anchor="middle" font-family="'Segoe UI',Helvetica,Arial,sans-serif" font-size="32" font-weight="800" fill="#f0ead8">12</text>
    <text x="0" y="26" text-anchor="middle" font-family="'Segoe UI',Helvetica,Arial,sans-serif" font-size="10.5" fill="#e8f2ea" letter-spacing="0.5">day streak</text>
  </g>

  <!-- small frog perched between pads -->
  <g transform="translate(215,60)">
    <ellipse cx="0" cy="6" rx="10" ry="6" fill="#3d7a5c"/>
    <circle cx="-5" cy="-1" r="4" fill="#3d7a5c"/>
    <circle cx="5" cy="-1" r="4" fill="#3d7a5c"/>
    <circle cx="-5" cy="-1.6" r="1.4" fill="#0d1f1a"/>
    <circle cx="5" cy="-1.6" r="1.4" fill="#0d1f1a"/>
  </g>

  <line x1="40" y1="150" x2="720" y2="150" stroke="#2e5f47" stroke-width="1" opacity="0.6"/>

  <text x="40" y="178" font-family="'JetBrains Mono','Courier New',monospace" font-size="11.5" fill="#7fb897" letter-spacing="1">most active in</text>
  <g font-family="'Segoe UI',Helvetica,Arial,sans-serif" font-size="13" font-weight="600">
    <text x="180" y="178" fill="#e8a5c4">TypeScript</text>
    <text x="290" y="178" fill="#4a8763">·</text>
    <text x="305" y="178" fill="#e8c468">Go</text>
    <text x="335" y="178" fill="#4a8763">·</text>
    <text x="350" y="178" fill="#8fd4a8">Rust</text>
  </g>
