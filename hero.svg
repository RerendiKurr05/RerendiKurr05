<svg width="900" height="260" viewBox="0 0 900 260" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="water" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0d1f1a"/>
      <stop offset="100%" stop-color="#122a22"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="38%" r="65%">
      <stop offset="0%" stop-color="#3d7a5c" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#3d7a5c" stop-opacity="0"/>
    </radialGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="0.4"/>
    </filter>
  </defs>

  <rect width="900" height="260" fill="url(#water)"/>
  <rect width="900" height="260" fill="url(#glow)"/>

  <!-- ripple rings: signature element, off-center like something just landed -->
  <g stroke="#5a9873" fill="none" opacity="0.55">
    <circle cx="700" cy="120" r="18" stroke-width="1.4"/>
    <circle cx="700" cy="120" r="34" stroke-width="1.1" opacity="0.7"/>
    <circle cx="700" cy="120" r="52" stroke-width="0.9" opacity="0.5"/>
    <circle cx="700" cy="120" r="72" stroke-width="0.7" opacity="0.32"/>
    <circle cx="700" cy="120" r="95" stroke-width="0.5" opacity="0.18"/>
  </g>
  <g stroke="#e8a5c4" fill="none" opacity="0.4">
    <circle cx="120" cy="205" r="10" stroke-width="1"/>
    <circle cx="120" cy="205" r="20" stroke-width="0.8" opacity="0.6"/>
    <circle cx="120" cy="205" r="32" stroke-width="0.6" opacity="0.35"/>
  </g>

  <!-- lily pads, small and understated -->
  <g opacity="0.85">
    <ellipse cx="805" cy="205" rx="26" ry="15" fill="#3d7a5c"/>
    <path d="M805 205 L825 197" stroke="#0d1f1a" stroke-width="2" fill="none"/>
    <ellipse cx="845" cy="222" rx="17" ry="10" fill="#2e5f47"/>
    <path d="M845 222 L858 216" stroke="#0d1f1a" stroke-width="1.5" fill="none"/>
  </g>
  <g opacity="0.7">
    <ellipse cx="60" cy="55" rx="20" ry="12" fill="#2e5f47"/>
    <path d="M60 55 L75 48" stroke="#0d1f1a" stroke-width="1.5" fill="none"/>
  </g>

  <!-- frog, simple geometric mark -->
  <g transform="translate(738,150)" filter="url(#soft)">
    <ellipse cx="0" cy="14" rx="26" ry="15" fill="#3d7a5c"/>
    <circle cx="-14" cy="-4" r="9" fill="#3d7a5c"/>
    <circle cx="14" cy="-4" r="9" fill="#3d7a5c"/>
    <circle cx="-14" cy="-6" r="3.4" fill="#0d1f1a"/>
    <circle cx="14" cy="-6" r="3.4" fill="#0d1f1a"/>
    <circle cx="-14.8" cy="-7" r="0.9" fill="#f0ead8"/>
    <circle cx="13.2" cy="-7" r="0.9" fill="#f0ead8"/>
    <path d="M-10 20 Q0 26 10 20" stroke="#0d1f1a" stroke-width="1.6" fill="none" stroke-linecap="round"/>
  </g>

  <!-- wordmark -->
  <text x="60" y="118" font-family="'JetBrains Mono','Courier New',monospace" font-size="15" fill="#5a9873" letter-spacing="3">// hello_world.pond</text>
  <text x="58" y="162" font-family="'Segoe UI',Helvetica,Arial,sans-serif" font-size="46" font-weight="700" fill="#f0ead8">REREN</text>
  <text x="58" y="192" font-family="'Segoe UI',Helvetica,Arial,sans-serif" font-size="15" fill="#a9c4b3">visual developer &amp; pond enthusiast</text>

  <rect x="58" y="205" width="46" height="3" fill="#e8c468"/>
</svg>
